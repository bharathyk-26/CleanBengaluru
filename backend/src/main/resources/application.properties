spring.application.name=cleanbengaluru-backend

# ===== Server =====
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/api
server.error.include-message=always

# ===== Database =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cleanbengaluru}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:8197}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# MUST be at least 32 characters (256 bits) for HS256
app.jwt.secret=${JWT_SECRET:cleanbengaluru-super-secret-key-change-me-in-production-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== File upload =====
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== Business rules =====
app.duplicate.radius-metres=100
app.duplicate.window-hours=24
app.seed.enabled=true

# ===== CORS =====
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://10.156.140.128:5173
# ===== Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.cleanbengaluru=DEBUG
